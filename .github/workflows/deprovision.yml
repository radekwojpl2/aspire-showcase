name: Deprovision

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the resource group name to confirm deleting it
        required: true
        type: string

permissions:
  id-token: write # OIDC login to Azure
  contents: read

# Shared with the Deploy workflow so the two never run at the same time.
concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deprovision:
    runs-on: ubuntu-latest
    environment: production
    env:
      ASPIRE_CLI_VERSION: 13.5.4
      # Read by the AppHost's Azure provisioning, same as in the Deploy workflow.
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__CredentialSource: AzureCli
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$Azure__ResourceGroup" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match the resource group '$Azure__ResourceGroup'."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version "$ASPIRE_CLI_VERSION"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Deletes the whole resource group, including the pipeline's role assignments.
      # Re-run scripts/setup-azure-oidc.ps1 before the next deploy.
      - name: Destroy with Aspire
        run: >
          aspire destroy
          --apphost src/AspireShowcase.AppHost/AspireShowcase.AppHost.csproj
          --non-interactive
          --yes
          --nologo
