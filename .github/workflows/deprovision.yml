name: Deprovision

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the resource group name to confirm deleting everything in it
        required: true
        type: string

permissions:
  id-token: write # OIDC login to Azure
  contents: read

# Shared with the Deploy workflow so the two never run at the same time.
concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deprovision:
    runs-on: ubuntu-latest
    environment: production
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$RESOURCE_GROUP" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match the resource group '$RESOURCE_GROUP'."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: List resources to delete
        run: az resource list --resource-group "$RESOURCE_GROUP" --query "[].{name:name, type:type}" --output table

      # A Complete-mode deployment of an empty template deletes every resource in the group,
      # in dependency order. The resource group itself and its role assignments are kept,
      # so the Deploy workflow can recreate everything without re-running the setup script.
      - name: Delete all resources in the resource group
        run: |
          echo '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#","contentVersion":"1.0.0.0","resources":[]}' > empty.json
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "deprovision-${{ github.run_id }}" \
            --mode Complete \
            --template-file empty.json \
            --output none

      # Deleting the key vault only soft-deletes it, which keeps its name taken for 90 days. Its
      # name comes from the resource group, so the next deploy would fail with "A vault with the
      # same name already exists in deleted state". Purging needs the role setup-azure-oidc.ps1
      # creates on the subscription.
      - name: Purge the deleted key vault
        run: |
          if ! deleted=$(az keyvault list-deleted --resource-type vault --query "[].[name, properties.location, properties.vaultId]" --output tsv); then
            echo "::error::Can't list deleted key vaults. Run scripts/setup-azure-oidc.ps1 again: it gives Deprovision the role to purge them."
            exit 1
          fi
          # Only the vaults that were in this resource group; there may be none.
          { echo "$deleted" | grep -i "/resourceGroups/$RESOURCE_GROUP/" || true; } | while IFS=$'\t' read -r name location _; do
            echo "Purging $name"
            az keyvault purge --name "$name" --location "$location" --output none
          done

      - name: Verify
        run: |
          remaining=$(az resource list --resource-group "$RESOURCE_GROUP" --query "length(@)" --output tsv)
          echo "Resources left in $RESOURCE_GROUP: $remaining"
          if [ "$remaining" != "0" ]; then
            az resource list --resource-group "$RESOURCE_GROUP" --query "[].{name:name, type:type}" --output table
            echo "::warning::Some resources were not deleted."
          fi
