name: Deploy

on:
  # Started by hand only: Actions → Deploy → Run workflow, or `gh workflow run Deploy`.
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure
  contents: read

# Shared with the Deprovision workflow so the two never run at the same time.
concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    # The run can be started from any branch, but only main is deployed: it's the branch
    # that pull requests and CI protect.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      ASPIRE_CLI_VERSION: 13.6.0
      # Read by the AppHost's Azure provisioning during `aspire deploy`.
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__CredentialSource: AzureCli
      # Admin password of the PostgreSQL server that Logto uses. It has to stay the same
      # across deploys, so it comes from a secret instead of being generated on each run.
      Parameters__postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
      # ID of the Logto application the React app signs in with, created in the Azure Logto
      # admin console after the first deploy. Until it's set, the app runs without sign-in.
      Parameters__logto-app-id: ${{ vars.LOGTO_APP_ID }}
    steps:
      - name: Check secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::POSTGRES_PASSWORD is not set on the production environment. Run scripts/setup-azure-oidc.ps1."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version "$ASPIRE_CLI_VERSION"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        run: >
          aspire deploy
          --apphost src/AspireShowcase.AppHost/AspireShowcase.AppHost.csproj
          --non-interactive
          --nologo
