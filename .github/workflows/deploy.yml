name: Deploy

on:
  # Deploy only after CI (backend + frontend) succeeds on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure
  contents: read

# Shared with the Deprovision workflow so the two never run at the same time.
concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    # Skip failed CI runs and CI runs triggered by pull requests.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      ASPIRE_CLI_VERSION: 13.6.0
      # Read by the AppHost's Azure provisioning during `aspire deploy`.
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__CredentialSource: AzureCli
      # Admin password of the PostgreSQL server that Logto uses. It has to stay the same
      # across deploys, so it comes from a secret instead of being generated on each run.
      Parameters__postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::POSTGRES_PASSWORD is not set on the production environment. Run scripts/setup-azure-oidc.ps1."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI built, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version "$ASPIRE_CLI_VERSION"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        run: >
          aspire deploy
          --apphost src/AspireShowcase.AppHost/AspireShowcase.AppHost.csproj
          --non-interactive
          --nologo
