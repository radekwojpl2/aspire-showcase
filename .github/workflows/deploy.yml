name: Deploy

on:
  # Started by hand only: Actions → Deploy → Run workflow, or `gh workflow run Deploy`.
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Deploy the selected branch even though it isn't main
        type: boolean
        default: false

permissions:
  id-token: write # OIDC login to Azure
  contents: read

# Shared with the Deprovision workflow so the two never run at the same time.
concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    # main is deployed by default: it's the branch that pull requests and CI protect. Another
    # branch only with deploy_branch ticked, to try it in Azure before merging; whatever was
    # deployed last is what runs there, until main is deployed again.
    if: github.ref == 'refs/heads/main' || inputs.deploy_branch
    runs-on: ubuntu-latest
    environment: production
    env:
      ASPIRE_CLI_VERSION: 13.6.0
      # Read by the AppHost's Azure provisioning during `aspire deploy`.
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__CredentialSource: AzureCli
      # Admin password of the PostgreSQL server that Logto uses. It has to stay the same
      # across deploys, so it comes from a secret instead of being generated on each run.
      Parameters__postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
      # The Logto applications, created in the Azure Logto admin console after the first deploy:
      # the "Traditional web" one bff signs users in with (until it's set, the app runs without
      # sign-in), and the machine-to-machine one web gives owners their role with.
      Parameters__logto-app-id: ${{ vars.LOGTO_APP_ID }}
      Parameters__logto-app-secret: ${{ secrets.LOGTO_APP_SECRET }}
      Parameters__logto-m2m-app-id: ${{ vars.LOGTO_M2M_APP_ID }}
      Parameters__logto-m2m-app-secret: ${{ secrets.LOGTO_M2M_APP_SECRET }}
      # Booking emails through Resend; until they're set, emails are skipped and logged.
      Parameters__resend-api-key: ${{ secrets.RESEND_API_KEY }}
      Parameters__email-sender: ${{ vars.EMAIL_SENDER }}
    steps:
      - name: Check secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::POSTGRES_PASSWORD is not set on the production environment. Run scripts/setup-azure-oidc.ps1."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version "$ASPIRE_CLI_VERSION"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        run: >
          aspire deploy
          --apphost src/AspireShowcase.AppHost/AspireShowcase.AppHost.csproj
          --non-interactive
          --nologo
